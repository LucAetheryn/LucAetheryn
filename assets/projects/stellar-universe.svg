<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="STELLAR UNIVERSE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF">
        <animate attributeName="stop-color" values="#06B6FF;#7C3AED;#EC4899;#06B6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6FF;#7C3AED;#EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="stars" width="110" height="90" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
      <circle cx="72" cy="54" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="95" cy="12" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="560" height="190" rx="18" fill="url(#bg)"/>
  <rect width="560" height="190" rx="18" fill="url(#stars)" opacity=".65"/>
  <rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#grad)" stroke-opacity=".7" stroke-width="1.5"/>

  <circle cx="485" cy="45" r="34" fill="#06B6FF" opacity=".09"/>
  <ellipse cx="485" cy="45" rx="42" ry="13" fill="none" stroke="#7C3AED" stroke-opacity=".65" transform="rotate(-25 485 45)"/>
  <circle cx="485" cy="45" r="10" fill="#06B6FF" filter="url(#glow)"/>
  <circle cx="485" cy="45" r="3" fill="#EAF8FF"/>

  <text x="28" y="47" fill="#06B6FF" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PROJECT / CONCEPT</text>

  <text x="28" y="91" fill="url(#grad)" font-family="Arial, sans-serif" font-size="27" font-weight="700">STELLAR UNIVERSE</text>

  <text x="28" y="122" fill="#A9B9D8" font-family="Arial, sans-serif" font-size="15">Personal brand • Portfolio</text>

  <text x="28" y="157" fill="#D3DDF0" font-family="Arial, sans-serif" font-size="13">Visual identity, portfolio experience &amp; creative engineering</text>
</svg>
