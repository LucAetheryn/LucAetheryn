<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="NUVIO FINANCE">
  <defs>
    <linearGradient id="nuvio-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081725"/>
      <stop offset=".55" stop-color="#102638"/>
      <stop offset="1" stop-color="#123B49"/>
    </linearGradient>
    <linearGradient id="nuvio-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42D6C5">
        <animate attributeName="stop-color" values="#42D6C5;#64B5F6;#8CE4BD;#42D6C5" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8CE4BD">
        <animate attributeName="stop-color" values="#8CE4BD;#42D6C5;#64B5F6;#8CE4BD" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="nuvio-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8CE4BD" stroke-opacity=".07" stroke-width=".7"/>
    </pattern>
    <filter id="nuvio-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="560" height="190" rx="18" fill="url(#nuvio-bg)"/>
  <rect width="560" height="190" rx="18" fill="url(#nuvio-grid)"/>
  <rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#nuvio-grad)" stroke-opacity=".65" stroke-width="1.5"/>

  <!-- Financial growth motif -->
  <g transform="translate(485 76)">
    <circle r="34" fill="#42D6C5" opacity=".06"/>
    <circle r="27" fill="none" stroke="#42D6C5" stroke-opacity=".2"/>
    <path d="M-22 15 L-10 5 L0 10 L17 -12" fill="none" stroke="url(#nuvio-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#nuvio-glow)"/>
    <path d="M7 -12 H17 V-2" fill="none" stroke="#8CE4BD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 23 H22" stroke="#8CE4BD" stroke-opacity=".45"/>
    <circle cx="-10" cy="5" r="2.5" fill="#64B5F6"/>
    <circle cx="0" cy="10" r="2.5" fill="#42D6C5"/>
    <circle cx="17" cy="-12" r="3" fill="#8CE4BD"/>
  </g>

  <text x="28" y="47" fill="#42D6C5" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PROJECT / CONCEPT</text>

  <text x="28" y="91" fill="url(#nuvio-grad)" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1">NUVIO FINANCE</text>

  <text x="28" y="122" fill="#A9C5D1" font-family="Arial, sans-serif" font-size="15">Personal Finance OS</text>

  <text x="28" y="157" fill="#D8E8EB" font-family="Arial, sans-serif" font-size="13">A thoughtful space for personal money management</text>
</svg>
