<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="SAFAA">
  <defs>
    <linearGradient id="safaa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1715"/>
      <stop offset=".55" stop-color="#142820"/>
      <stop offset="1" stop-color="#26382B"/>
    </linearGradient>
    <linearGradient id="safaa-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B8D9A7">
        <animate attributeName="stop-color" values="#B8D9A7;#E4D5A2;#91C8AE;#B8D9A7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#E4D5A2">
        <animate attributeName="stop-color" values="#E4D5A2;#91C8AE;#B8D9A7;#E4D5A2" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="safaa-pattern" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M17 2 L32 17 L17 32 L2 17 Z" fill="none" stroke="#B8D9A7" stroke-opacity=".055"/>
    </pattern>
    <filter id="safaa-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="560" height="190" rx="18" fill="url(#safaa-bg)"/>
  <rect width="560" height="190" rx="18" fill="url(#safaa-pattern)"/>
  <rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#safaa-grad)" stroke-opacity=".65" stroke-width="1.5"/>

  <!-- Calm architectural arch and crescent-inspired motif -->
  <g transform="translate(485 76)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="34" stroke="#B8D9A7" stroke-opacity=".18"/>
    <path d="M-23 23 V-5 A23 23 0 0 1 23 -5 V23" stroke="url(#safaa-grad)" stroke-width="2"/>
    <path d="M-15 23 V1 A15 15 0 0 1 15 1 V23" stroke="#B8D9A7" stroke-opacity=".55" stroke-width="1.2"/>
    <path d="M-26 23 H26" stroke="#E4D5A2" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M10 -18 A10 10 0 1 0 20 -5 A8 8 0 0 1 10 -18Z" fill="#E4D5A2" stroke="none" filter="url(#safaa-glow)"/>
    <circle cx="-19" cy="-17" r="1.5" fill="#B8D9A7" stroke="none"/>
    <circle cx="23" cy="-20" r="1.2" fill="#E4D5A2" stroke="none"/>
  </g>

  <text x="28" y="47" fill="#B8D9A7" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PROJECT / CONCEPT</text>

  <text x="28" y="91" fill="url(#safaa-grad)" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="2">SAFAA</text>

  <text x="28" y="122" fill="#C1D0C2" font-family="Arial, sans-serif" font-size="15">Muslim Companion</text>

  <text x="28" y="157" fill="#E5E9DD" font-family="Arial, sans-serif" font-size="13">A companion concept for everyday spiritual life</text>
</svg>
