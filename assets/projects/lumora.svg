<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="LUMORA">
  <defs>
    <linearGradient id="lumora-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1715"/>
      <stop offset=".55" stop-color="#10251F"/>
      <stop offset="1" stop-color="#1D3028"/>
    </linearGradient>
    <linearGradient id="lumora-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8BD5A8">
        <animate attributeName="stop-color" values="#8BD5A8;#C5E6A6;#74C9B5;#8BD5A8" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#D5E9A8">
        <animate attributeName="stop-color" values="#D5E9A8;#74C9B5;#8BD5A8;#D5E9A8" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="lumora-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="lumora-dots" width="85" height="85" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="18" r="1" fill="#C5E6A6" opacity=".25"/>
      <circle cx="66" cy="61" r=".8" fill="#8BD5A8" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="560" height="190" rx="18" fill="url(#lumora-bg)"/>
  <rect width="560" height="190" rx="18" fill="url(#lumora-dots)"/>
  <rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#lumora-grad)" stroke-opacity=".65" stroke-width="1.5"/>

  <!-- LUMORA symbol: L, leaf, star and circular foundation -->
  <g transform="translate(485 47)" fill="none" stroke="url(#lumora-grad)" stroke-linecap="round" stroke-linejoin="round">
    <circle r="31" stroke-width="1.2" opacity=".3"/>
    <path d="M-12 -17 V15 H8" stroke-width="3"/>
    <path d="M-5 3 C-5 -10 8 -16 18 -13 C17 -2 10 8 -5 8" stroke-width="2"/>
    <path d="M-4 8 L12 -9" stroke-width="1.4"/>
    <path d="M17 -25 L19 -20 L24 -18 L19 -16 L17 -11 L15 -16 L10 -18 L15 -20 Z" fill="#D5E9A8" stroke="none" filter="url(#lumora-glow)"/>
    <path d="M-19 23 H19" stroke-width="1.5" opacity=".65"/>
  </g>

  <text x="28" y="47" fill="#8BD5A8" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PROJECT / CONCEPT</text>

  <text x="28" y="91" fill="url(#lumora-grad)" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="2">LUMORA</text>

  <text x="28" y="122" fill="#B5C9BC" font-family="Arial, sans-serif" font-size="15">Personal Life OS</text>

  <text x="28" y="157" fill="#E0EAE2" font-family="Arial, sans-serif" font-size="13">A clearer way to organize everyday life</text>
</svg>
