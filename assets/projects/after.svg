<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="AFTER">
  <defs>
    <linearGradient id="after-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A0A0D"/>
      <stop offset=".55" stop-color="#15121E"/>
      <stop offset="1" stop-color="#24172B"/>
    </linearGradient>
    <linearGradient id="after-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6D5CFF">
        <animate attributeName="stop-color" values="#6D5CFF;#FF7BAC;#A78BFA;#6D5CFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#FF7BAC">
        <animate attributeName="stop-color" values="#FF7BAC;#A78BFA;#6D5CFF;#FF7BAC" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="after-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="after-grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="20" r=".8" fill="#EAEAF2" opacity=".25"/>
      <circle cx="70" cy="62" r=".7" fill="#FF7BAC" opacity=".3"/>
      <circle cx="42" cy="78" r=".6" fill="#6D5CFF" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="560" height="190" rx="18" fill="url(#after-bg)"/>
  <rect width="560" height="190" rx="18" fill="url(#after-grain)" opacity=".65"/>
  <rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#after-grad)" stroke-opacity=".7" stroke-width="1.5"/>

  <!-- AFTER identity: arch, horizon and moment -->
  <g transform="translate(485 79)">
    <path d="M-25 17 V-5 A25 25 0 0 1 25 -5 V17"
          fill="none" stroke="url(#after-grad)" stroke-width="2.5" opacity=".9"/>
    <path d="M-34 17 H34" stroke="#A6A6B3" stroke-opacity=".7" stroke-width="1.2"/>
    <circle cx="0" cy="-5" r="5" fill="#FF7BAC" filter="url(#after-glow)"/>
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#FF7BAC" stroke-opacity=".2"/>
  </g>

  <text x="28" y="47" fill="#FF7BAC" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PROJECT / CONCEPT</text>

  <text x="28" y="91" fill="url(#after-grad)" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2">AFTER</text>

  <text x="28" y="122" fill="#A6A6B3" font-family="Arial, sans-serif" font-size="15">Personal Life Archive</text>

  <text x="28" y="157" fill="#EAEAF2" font-family="Arial, sans-serif" font-size="13">A private home for memories and moments</text>
</svg>
