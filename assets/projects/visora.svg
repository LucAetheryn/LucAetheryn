<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="VISORA">
  <defs>
    <linearGradient id="visora-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1420"/>
      <stop offset=".55" stop-color="#102638"/>
      <stop offset="1" stop-color="#15384A"/>
    </linearGradient>
    <linearGradient id="visora-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#54C8F5">
        <animate attributeName="stop-color" values="#54C8F5;#7B9EFF;#74E0D0;#54C8F5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#74E0D0">
        <animate attributeName="stop-color" values="#74E0D0;#54C8F5;#7B9EFF;#74E0D0" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="visora-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#54C8F5" stroke-opacity=".06"/>
    </pattern>
    <filter id="visora-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="560" height="190" rx="18" fill="url(#visora-bg)"/>
  <rect width="560" height="190" rx="18" fill="url(#visora-grid)"/>
  <rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#visora-grad)" stroke-opacity=".7" stroke-width="1.5"/>

  <!-- Optical lens and precision motif -->
  <g transform="translate(485 76)" fill="none" stroke-linecap="round">
    <circle r="34" stroke="#54C8F5" stroke-opacity=".15"/>
    <circle r="23" stroke="url(#visora-grad)" stroke-width="2.2"/>
    <circle r="16" stroke="#74E0D0" stroke-opacity=".45" stroke-width="1"/>
    <path d="M-32 0 H-23 M23 0 H32 M0 -32 V-23 M0 23 V32" stroke="#74E0D0" stroke-width="1.5"/>
    <path d="M-10 0 Q0 -11 10 0 Q0 11 -10 0Z" stroke="url(#visora-grad)" stroke-width="2"/>
    <circle r="3.5" fill="#74E0D0" stroke="none" filter="url(#visora-glow)"/>
  </g>

  <text x="28" y="47" fill="#54C8F5" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PROJECT / CONCEPT</text>

  <text x="28" y="91" fill="url(#visora-grad)" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="2">VISORA</text>

  <text x="28" y="122" fill="#B2C9D8" font-family="Arial, sans-serif" font-size="15">Optical Management System</text>

  <text x="28" y="157" fill="#DCE8EF" font-family="Arial, sans-serif" font-size="13">A management experience for optical retail</text>
</svg>
