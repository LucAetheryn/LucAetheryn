<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Lucky Praditya — Stellar Universe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>

    <linearGradient id="planet" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset=".48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Animated tagline gradient -->
    <linearGradient id="taglineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF">
        <animate attributeName="stop-color"
          values="#06B6FF;#7C3AED;#EC4899;#06B6FF"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color"
          values="#EC4899;#06B6FF;#7C3AED;#EC4899"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="planetGlow">
      <stop stop-color="#7C3AED" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="340" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle cx="930" cy="170" r="220" fill="url(#planetGlow)"/>

    <!-- Background stars -->
    <g fill="#DCEBFF">
      <circle cx="80" cy="45" r="1.5" opacity=".7"/>
      <circle cx="280" cy="35" r="1" opacity=".6"/>
      <circle cx="470" cy="290" r="1.5" opacity=".5"/>
      <circle cx="680" cy="60" r="1.3" opacity=".7"/>
      <circle cx="1120" cy="275" r="1.5" opacity=".7"/>
      <circle cx="1080" cy="48" r="1" opacity=".6"/>
      <circle cx="760" cy="280" r="1" opacity=".6"/>
      <circle cx="40" cy="250" r="1" opacity=".5"/>
    </g>

    <!-- Twinkling stars -->
    <g fill="#06B6FF">
      <circle cx="190" cy="270" r="1.4">
        <animate attributeName="opacity"
          values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="730" cy="130" r="1.8">
        <animate attributeName="opacity"
          values="1;.2;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="75" r="1.6">
        <animate attributeName="opacity"
          values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Distant rotating star -->
    <path d="M1080 115 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"
      fill="#fff" opacity=".9" filter="url(#glow)">
      <animateTransform attributeName="transform"
        type="rotate"
        from="0 1080 134"
        to="360 1080 134"
        dur="24s"
        repeatCount="indefinite"/>
    </path>

    <!-- Planetary orbit -->
    <g transform="translate(925 172)">
      <ellipse rx="205" ry="73" fill="none"
        stroke="#7C3AED" stroke-width="1.5" opacity=".25">
        <animateTransform attributeName="transform"
          type="rotate"
          from="-25" to="335"
          dur="55s"
          repeatCount="indefinite"/>
      </ellipse>

      <!-- Rear ring -->
      <ellipse rx="165" ry="58" fill="none"
        stroke="url(#ring)" stroke-width="9"
        opacity=".35" transform="rotate(-24)"/>

      <!-- Planet -->
      <circle r="67" fill="url(#planet)" filter="url(#glow)"/>

      <path d="M-48 -15 Q-5 -62 48 -25 Q20 0 -48 25Z"
        fill="#fff" opacity=".09"/>

      <path d="M-40 35 Q5 55 48 15"
        fill="none" stroke="#fff"
        stroke-width="2" opacity=".13"/>

      <!-- Planet highlight -->
      <ellipse cx="-23" cy="-30" rx="18" ry="9"
        fill="#fff" opacity=".18"
        transform="rotate(-35)"/>

      <!-- Animated front ring -->
      <g>
        <ellipse rx="165" ry="58" fill="none"
          stroke="url(#ring)" stroke-width="4"
          opacity=".95" transform="rotate(-24)"/>

        <animateTransform attributeName="transform"
          type="rotate"
          from="0" to="360"
          dur="48s"
          repeatCount="indefinite"/>
      </g>

      <!-- Orbiting star -->
      <g>
        <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3Z"
          fill="#fff" filter="url(#glow)"/>

        <animateMotion dur="12s"
          repeatCount="indefinite"
          path="M-185,-30 A190,70 0 1,1 185,30 A190,70 0 1,1 -185,-30"/>
      </g>
    </g>

    <!-- Main identity -->
    <text x="72" y="91" fill="#A9B9D8"
      font-family="Arial,sans-serif"
      font-size="15" letter-spacing="5">
      VISUAL DESIGNER • BUILDER • EXPLORER
    </text>

    <text x="68" y="174" fill="#FFFFFF"
      font-family="Arial,sans-serif"
      font-size="63" font-weight="700"
      letter-spacing="1">
      LUCKY PRADITYA
    </text>

    <!-- Animated color-changing tagline -->
    <text x="72" y="222" fill="url(#taglineGrad)"
      font-family="Arial,sans-serif"
      font-size="25" font-weight="700">
      Visual &amp; AI Engineer Enthusiast
    </text>

    <text x="72" y="270" fill="#A9B9D8"
      font-family="Arial,sans-serif"
      font-size="16" letter-spacing=".5">
      Designing ideas. Building experiences. Exploring what's next.
    </text>

    <rect x="72" y="295" width="110" height="3"
      rx="2" fill="url(#ring)"/>
  </g>
</svg>
