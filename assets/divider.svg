<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Stellar Universe Cosmic Divider">
<defs>
  <linearGradient id="dv-line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#06B6FF" stop-opacity="0"/>
    <stop offset=".28" stop-color="#06B6FF"/>
    <stop offset=".5" stop-color="#7C3AED"/>
    <stop offset=".72" stop-color="#EC4899"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
  </linearGradient>
  <filter id="dv-glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<path d="M30 50 H1170" stroke="url(#dv-line)" stroke-width="1.5" opacity=".7"/>
<path d="M220 50 H980" stroke="url(#dv-line)" stroke-width="3" opacity=".45" filter="url(#dv-glow)"/>
<g transform="translate(600 50)">
  <circle r="18" fill="#7C3AED" opacity=".12"/>
  <circle r="9" fill="#11152D" stroke="#06B6FF" stroke-width="1.5"/>
  <circle r="3.5" fill="#EC4899" filter="url(#dv-glow)"/>
  <path d="M-27 0 L-15 -12 L-3 0 L-15 12 Z" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
  <path d="M3 0 L15 -12 L27 0 L15 12 Z" fill="none" stroke="#EC4899" stroke-width="1.2"/>
</g>
<g fill="#DCEBFF">
  <circle cx="220" cy="50" r="2" opacity=".8"/>
  <circle cx="980" cy="50" r="2" opacity=".8"/>
  <circle cx="390" cy="50" r="1.5" opacity=".6"/>
  <circle cx="810" cy="50" r="1.5" opacity=".6"/>
</g>
</svg>
