<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="AI Toolbox — A human-led workflow, accelerated by AI tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1022"/>
      <stop offset=".55" stop-color="#11142B"/>
      <stop offset="1" stop-color="#17112E"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <pattern id="stars" width="160" height="110" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1.2" fill="#06B6FF"/>
      <circle cx="70" cy="42" r=".9" fill="#DCEBFF"/>
      <circle cx="132" cy="18" r="1.1" fill="#EC4899"/>
      <circle cx="105" cy="88" r=".8" fill="#06B6FF"/>
      <circle cx="35" cy="98" r=".7" fill="#DCEBFF"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="20" fill="url(#stars)" opacity=".75"/>

  <text x="32" y="48" fill="#F1F5FF" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing=".5">AI TOOLBOX</text>
  <text x="32" y="73" fill="#A8B6D4" font-family="Arial, sans-serif" font-size="16">A human-led workflow, accelerated by AI tools</text>

  <!-- Card 01 -->
  <g>
    <rect x="24" y="100" width="557" height="161" rx="17" fill="#0E192F" stroke="#344765" stroke-width="1"/>
    <rect x="42" y="116" width="44" height="44" rx="13" fill="#1B3455"/>
    <text x="64" y="144" text-anchor="middle" fill="#06B6FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">01</text>
    <text x="100" y="139" fill="#F0F4FF" font-family="Arial, sans-serif" font-size="20" font-weight="700">CHATGPT</text>
    <text x="44" y="191" fill="url(#pink)" font-family="Arial, sans-serif" font-size="16" font-weight="700">Thinking, planning &amp; problem-solving</text>
    <text x="44" y="221" fill="#A8B6D4" font-family="Arial, sans-serif" font-size="14">Product requirements • prompt writing • architecture • debugging</text>
  </g>

  <!-- Card 02 -->
  <g>
    <rect x="596" y="100" width="557" height="161" rx="17" fill="#0E192F" stroke="#344765" stroke-width="1"/>
    <rect x="614" y="116" width="44" height="44" rx="13" fill="#1B3455"/>
    <text x="636" y="144" text-anchor="middle" fill="#06B6FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">02</text>
    <text x="672" y="139" fill="#F0F4FF" font-family="Arial, sans-serif" font-size="20" font-weight="700">GOOGLE GEMINI</text>
    <text x="616" y="191" fill="url(#pink)" font-family="Arial, sans-serif" font-size="16" font-weight="700">Visual exploration &amp; research</text>
    <text x="616" y="221" fill="#A8B6D4" font-family="Arial, sans-serif" font-size="14">Reference analysis • creative direction • image-based ideation</text>
  </g>

  <!-- Card 03 -->
  <g>
    <rect x="24" y="277" width="557" height="161" rx="17" fill="#0E192F" stroke="#344765" stroke-width="1"/>
    <rect x="42" y="293" width="44" height="44" rx="13" fill="#1B3455"/>
    <text x="64" y="321" text-anchor="middle" fill="#06B6FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">03</text>
    <text x="100" y="316" fill="#F0F4FF" font-family="Arial, sans-serif" font-size="20" font-weight="700">GOOGLE STITCH</text>
    <text x="44" y="368" fill="url(#pink)" font-family="Arial, sans-serif" font-size="16" font-weight="700">AI-assisted UI/UX generation</text>
    <text x="44" y="398" fill="#A8B6D4" font-family="Arial, sans-serif" font-size="14">Screen exploration • layout generation • design-to-code reference</text>
  </g>

  <!-- Card 04 -->
  <g>
    <rect x="596" y="277" width="557" height="161" rx="17" fill="#0E192F" stroke="#344765" stroke-width="1"/>
    <rect x="614" y="293" width="44" height="44" rx="13" fill="#1B3455"/>
    <text x="636" y="321" text-anchor="middle" fill="#06B6FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">04</text>
    <text x="672" y="316" fill="#F0F4FF" font-family="Arial, sans-serif" font-size="20" font-weight="700">REPLIT AGENT</text>
    <text x="616" y="368" fill="url(#pink)" font-family="Arial, sans-serif" font-size="16" font-weight="700">AI-assisted implementation</text>
    <text x="616" y="398" fill="#A8B6D4" font-family="Arial, sans-serif" font-size="14">Feature building • code iteration • debugging inside Replit</text>
  </g>
</svg>
