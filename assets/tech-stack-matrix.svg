    <style>
      .heading{font-family:Arial,sans-serif;fill:#F1F5FF;font-weight:700}
      .sub{font-family:Arial,sans-serif;fill:#91A2C2}
      .category{font-family:Arial,sans-serif;fill:#EAF2FF;font-size:18px;font-weight:700}
      .item{font-family:Arial,sans-serif;fill:#C5D0E5;font-size:12px}
      .panel{fill:url(#panel);stroke:#33415F;stroke-width:1}
      .icon-bg{fill:#FFFFFF;opacity:.07}
      .icon-letter{font-family:Arial,sans-serif;font-size:21px;font-weight:700;text-anchor:middle}
    </style>

    <!-- Reusable icon tile -->
    <g id="tile">
      <rect width="52" height="52" rx="12" class="icon-bg"/>
    </g>
  </defs>

  <rect width="1200" height="1120" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>

  <g opacity=".12" fill="none" stroke="#06B6FF">
