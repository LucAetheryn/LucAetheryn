<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="1120"
     viewBox="0 0 1200 1120"
     role="img"
     aria-label="Lucky Praditya technology and creative stack">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#11152B"/>
      <stop offset="100%" stop-color="#17102D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17233B"/>
      <stop offset="100%" stop-color="#17152F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .heading { font-family: Arial,sans-serif; fill:#F1F5FF; font-weight:700; }
      .sub { font-family: Arial,sans-serif; fill:#91A2C2; }
      .category { font-family: Arial,sans-serif; fill:#EAF2FF; font-size:18px; font-weight:700; }
      .item { font-family: Arial,sans-serif; fill:#C5D0E5; font-size:12px; }
      .panel { fill:url(#panel); stroke:#33415F; stroke-width:1; }
      .icon { width:34px; height:34px; }
    </style>
  </defs>

  <rect width="1200" height="1120" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>

  <g opacity=".12" fill="none" stroke="#06B6FF">
