<svg xmlns="http://www.w3.org/2000/svg" width="600" height="125" viewBox="0 0 600 125" role="img" aria-label="GitHub Signals Mobile">
<defs>
  <linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1B"/><stop offset=".55" stop-color="#11152D"/><stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="sm-grad">
    <stop stop-color="#06B6FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <pattern id="sm-stars" width="90" height="75" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="18" r="1.2" fill="#DCEBFF" opacity=".7"/>
    <circle cx="65" cy="50" r="1" fill="#06B6FF" opacity=".8"/>
    <circle cx="82" cy="12" r="1" fill="#EC4899" opacity=".7"/>
  </pattern>
</defs>
<rect width="600" height="125" rx="16" fill="url(#sm-bg)"/>
<rect width="600" height="125" rx="16" fill="url(#sm-stars)"/>
<text x="30" y="40" fill="#06B6FF" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">06 / STELLAR UNIVERSE</text>
<text x="30" y="82" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="29" font-weight="700">GITHUB SIGNALS</text>
<text x="570" y="108" text-anchor="end" fill="#9AA8C7" font-family="Arial,sans-serif" font-size="11">CODE · CONSISTENCY · CONTRIBUTION</text>
<path d="M0 122 H600" stroke="url(#sm-grad)" stroke-width="3"/>
</svg>
