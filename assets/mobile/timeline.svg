
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-label="Creative journey timeline from 2022 to 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="110" height="90" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
      <circle cx="72" cy="54" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="95" cy="12" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>
  </defs>

  <rect width="600" height="650" rx="18" fill="url(#bg)"/>
  <rect width="600" height="650" rx="18" fill="url(#stars)" opacity=".65"/>

  <path d="M105 85 V565" stroke="#26304C" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 85 V565" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- 2022 -->
  <circle cx="105" cy="105" r="17" fill="#0F172A" stroke="#06B6FF" stroke-width="3" filter="url(#glow)"/>
  <path d="M105 94 L108 102 L116 105 L108 108 L105 116 L102 108 L94 105 L102 102 Z" fill="#DCEBFF"/>
  <g font-family="Arial, sans-serif">
    <text x="150" y="101" fill="#06B6FF" font-size="26" font-weight="700">2022</text>
    <text x="150" y="130" fill="#FFFFFF" font-size="19" font-weight="700">Creative Foundation</text>
    <text x="150" y="155" fill="#A9B9D8" font-size="16">Visual design &amp; illustration</text>
  </g>

  <!-- 2023 -->
  <circle cx="105" cy="220" r="17" fill="#0F172A" stroke="#06B6FF" stroke-width="3" filter="url(#glow)"/>
  <path d="M97 213 H113 V227 H97 Z M100 209 H110 M100 231 H110" fill="none" stroke="#DCEBFF" stroke-width="2" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <text x="150" y="216" fill="#06B6FF" font-size="26" font-weight="700">2023</text>
    <text x="150" y="245" fill="#FFFFFF" font-size="19" font-weight="700">Visual Exploration</text>
    <text x="150" y="270" fill="#A9B9D8" font-size="16">UI/UX &amp; digital interfaces</text>
  </g>

  <!-- 2024 -->
  <circle cx="105" cy="335" r="17" fill="#0F172A" stroke="#7C3AED" stroke-width="3" filter="url(#glow)"/>
  <circle cx="105" cy="335" r="8" fill="none" stroke="#DCEBFF" stroke-width="2"/>
  <path d="M94 335 H116 M105 324 V346" stroke="#DCEBFF" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif">
    <text x="150" y="331" fill="#7C3AED" font-size="26" font-weight="700">2024</text>
    <text x="150" y="360" fill="#FFFFFF" font-size="19" font-weight="700">Building Visual Identity</text>
    <text x="150" y="385" fill="#A9B9D8" font-size="16">Branding &amp; creative systems</text>
  </g>

  <!-- 2025 -->
  <circle cx="105" cy="450" r="17" fill="#0F172A" stroke="#7C3AED" stroke-width="3" filter="url(#glow)"/>
  <path d="M97 443 H113 V457 H97 Z M101 439 H109 M101 461 H109 M100 448 H110 M100 452 H110" fill="none" stroke="#DCEBFF" stroke-width="1.7" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <text x="150" y="446" fill="#7C3AED" font-size="26" font-weight="700">2025</text>
    <text x="150" y="475" fill="#FFFFFF" font-size="19" font-weight="700">Digital Product Development</text>
    <text x="150" y="500" fill="#A9B9D8" font-size="16">Independent products &amp; systems</text>
  </g>

  <!-- 2026 -->
  <circle cx="105" cy="565" r="17" fill="#0F172A" stroke="#EC4899" stroke-width="3" filter="url(#glow)"/>
  <path d="M105 553 L108 562 L117 565 L108 568 L105 577 L102 568 L93 565 L102 562 Z" fill="#DCEBFF"/>
  <g font-family="Arial, sans-serif">
    <text x="150" y="561" fill="#EC4899" font-size="26" font-weight="700">2026</text>
    <text x="150" y="590" fill="#FFFFFF" font-size="19" font-weight="700">Creative Engineering</text>
    <text x="150" y="615" fill="#A9B9D8" font-size="16">AI-assisted creation &amp; development</text>
  </g>
</svg>
