<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img" aria-label="Creative pause mobile">
<defs>
  <linearGradient id="mb-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1B"/>
    <stop offset=".55" stop-color="#11152D"/>
    <stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="mb-grad">
    <stop stop-color="#06B6FF"/>
    <stop offset=".5" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <pattern id="mb-stars" width="90" height="75" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
    <circle cx="65" cy="50" r="1" fill="#06B6FF" opacity=".8"/>
    <circle cx="82" cy="12" r="1" fill="#EC4899" opacity=".7"/>
  </pattern>
</defs>
<rect width="600" height="180" rx="18" fill="url(#mb-bg)"/>
<rect width="600" height="180" rx="18" fill="url(#mb-stars)"/>
<path d="M42 38 H180 M420 38 H558" stroke="url(#mb-grad)" stroke-width="1.5" opacity=".7"/>
<circle cx="300" cy="38" r="4" fill="#06B6FF"/>
<circle cx="300" cy="38" r="11" fill="none" stroke="#7C3AED" stroke-opacity=".6"/>
<text x="300" y="82" text-anchor="middle" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1">A LITTLE PAUSE</text>
<text x="300" y="111" text-anchor="middle" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="17">BETWEEN BIG IDEAS</text>
<text x="300" y="145" text-anchor="middle" fill="#06B6FF" font-family="Arial,sans-serif" font-size="14">☾  breathe · reflect · return stronger</text>
<path d="M0 176 H600" stroke="url(#mb-grad)" stroke-width="3"/>
</svg>
