<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="890" viewBox="0 0 640 890" role="img" aria-label="My AI Universe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090914"/>
      <stop offset=".55" stop-color="#111020"/>
      <stop offset="1" stop-color="#1B1028"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#EC4899"/>
      <stop offset=".5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#06B6FF"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#A855F7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity=".02"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="890" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="888" rx="17" fill="none" stroke="#44304F"/>

  <!-- Terminal header -->
  <circle cx="26" cy="25" r="5" fill="#EC4899"/>
  <circle cx="44" cy="25" r="5" fill="#A855F7"/>
  <circle cx="62" cy="25" r="5" fill="#06B6FF"/>
  <text x="84" y="30" fill="#8B829E" font-family="monospace" font-size="12">LUCAETHERYN / AI-TOOLBOX</text>
  <path d="M20 47 H620" stroke="#392A48"/>

  <text x="28" y="82" fill="#EC4899" font-family="monospace" font-size="13">&gt; initializing my-ai-universe</text>
  <text x="28" y="124" fill="#F6F0FF" font-family="Arial,sans-serif" font-size="36" font-weight="700">My AI Universe</text>
  <text x="28" y="151" fill="#A99BB9" font-family="monospace" font-size="12">A smarter workflow, built through curiosity</text>
  <text x="28" y="171" fill="#A99BB9" font-family="monospace" font-size="12">and experimentation.</text>

  <!-- Orbit illustration -->
  <g transform="translate(320 315)">
    <circle r="145" fill="url(#core)"/>
    <circle r="123" fill="none" stroke="#54305E" stroke-width="1" stroke-dasharray="3 8"/>
    <ellipse rx="139" ry="58" fill="none" stroke="#A855F7" stroke-opacity=".7" transform="rotate(-28)"/>
    <ellipse rx="118" ry="90" fill="none" stroke="#EC4899" stroke-opacity=".55" transform="rotate(48)"/>
    <ellipse rx="150" ry="105" fill="none" stroke="#06B6FF" stroke-opacity=".4" transform="rotate(-65)"/>

    <!-- Central identity -->
    <circle r="59" fill="#171126" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <circle r="49" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="0" y="10" text-anchor="middle" fill="#F8EEFF" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700">高弓</text>
    <text x="0" y="30" text-anchor="middle" fill="#A99BB9" font-family="monospace" font-size="8" letter-spacing="2">AI CORE</text>

    <!-- ChatGPT -->
    <g transform="translate(-104 -69)">
      <circle r="21" fill="#21152F" stroke="#EC4899"/>
      <image href="https://cdn.simpleicons.org/openai/FFFFFF" x="-11" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- Gemini -->
    <g transform="translate(17 -126)">
      <circle r="21" fill="#21152F" stroke="#A855F7"/>
      <image href="https://cdn.simpleicons.org/googlegemini/8E75B2" x="-11" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- Grok -->
    <g transform="translate(117 -48)">
      <circle r="21" fill="#21152F" stroke="#06B6FF"/>
      <image href="https://cdn.simpleicons.org/grok/FFFFFF" x="-11" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- Perplexity -->
    <g transform="translate(103 83)">
      <circle r="21" fill="#21152F" stroke="#EC4899"/>
      <image href="https://cdn.simpleicons.org/perplexity/20B8CD" x="-11" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- DeepSeek -->
    <g transform="translate(-24 126)">
      <circle r="21" fill="#21152F" stroke="#A855F7"/>
      <image href="https://cdn.simpleicons.org/deepseek/4D6BFE" x="-11" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- Codex: OpenAI mark -->
    <g transform="translate(-123 53)">
      <circle r="21" fill="#21152F" stroke="#06B6FF"/>
      <image href="https://cdn.simpleicons.org/openai/FFFFFF" x="-11" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <circle cx="-145" cy="-22" r="3" fill="#EC4899" filter="url(#glow)"/>
    <circle cx="145" cy="22" r="3" fill="#06B6FF" filter="url(#glow)"/>
  </g>

  <!-- Assistants -->
  <text x="28" y="502" fill="#EC4899" font-family="monospace" font-size="14">// assistants</text>
  <path d="M28 513 H612" stroke="#49304E"/>

  <g font-family="monospace" font-size="14" fill="#F0EAF7">
    <rect x="28" y="527" width="180" height="39" rx="7" fill="#1B1428" stroke="#59334F"/>
    <text x="118" y="552" text-anchor="middle">ChatGPT</text>
    <rect x="230" y="527" width="180" height="39" rx="7" fill="#1B1428" stroke="#59334F"/>
    <text x="320" y="552" text-anchor="middle">Gemini</text>
    <rect x="432" y="527" width="180" height="39" rx="7" fill="#1B1428" stroke="#59334F"/>
    <text x="522" y="552" text-anchor="middle">Grok</text>
    <rect x="118" y="576" width="180" height="39" rx="7" fill="#1B1428" stroke="#59334F"/>
    <text x="208" y="601" text-anchor="middle">Perplexity</text>
    <rect x="340" y="576" width="180" height="39" rx="7" fill="#1B1428" stroke="#59334F"/>
    <text x="430" y="601" text-anchor="middle">DeepSeek</text>
  </g>

  <!-- Coding agents and dev tools -->
  <text x="28" y="660" fill="#A855F7" font-family="monospace" font-size="14">// coding agents &amp; dev tools</text>
  <path d="M28 671 H612" stroke="#49304E"/>

  <g font-family="monospace" font-size="13" fill="#F0EAF7">
    <rect x="28" y="685" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="118" y="709" text-anchor="middle">OpenCode</text>
    <rect x="230" y="685" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="320" y="709" text-anchor="middle">Pi</text>
    <rect x="432" y="685" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="522" y="709" text-anchor="middle">Codex</text>

    <rect x="28" y="734" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="118" y="758" text-anchor="middle">Gemini CLI</text>
    <rect x="230" y="734" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="320" y="758" text-anchor="middle">GitHub Copilot</text>
    <rect x="432" y="734" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="522" y="758" text-anchor="middle">Cursor</text>

    <rect x="118" y="783" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="208" y="807" text-anchor="middle">Ollama</text>
    <rect x="340" y="783" width="180" height="38" rx="7" fill="#17172B" stroke="#493A67"/>
    <text x="430" y="807" text-anchor="middle">Hugging Face</text>
  </g>

  <!-- Footer -->
  <path d="M28 842 H612" stroke="#49304E"/>
  <text x="28" y="866" fill="#80748F" font-family="monospace" font-size="11">// human curiosity × artificial intelligence</text>
</svg>
