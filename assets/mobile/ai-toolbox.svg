      <g transform="translate(-11 -11) scale(.9167)"><use href="#ic-grok" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>

    <!-- Perplexity -->
    <g transform="translate(103 83)">
