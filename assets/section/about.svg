<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="About the creator">
  <defs>
    <linearGradient id="aboutGradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF">
        <animate attributeName="stop-color" values="#06B6FF;#7C3AED;#EC4899;#06B6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6FF;#7C3AED;#EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="aboutBackground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <pattern id="aboutStars" width="110" height="90" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
      <circle cx="72" cy="54" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="95" cy="12" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>
  </defs>

  <rect width="1200" height="110" rx="16" fill="url(#aboutBackground)"/>
  <rect width="1200" height="110" rx="16" fill="url(#aboutStars)"/>
  <rect x=".75" y=".75" width="1198.5" height="108.5" rx="15.25" fill="none" stroke="#35415F" stroke-opacity=".7"/>

  <rect x="22" y="18" width="4" height="74" rx="2" fill="url(#aboutGradient)"/>

  <text x="42" y="39" fill="#06B6FF" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">01 / STELLAR UNIVERSE</text>
  <text x="42" y="78" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing=".5">ABOUT THE CREATOR</text>

  <text x="1160" y="68" text-anchor="end" fill="#AAB6D2" font-family="Arial, sans-serif" font-size="15">
    Curiosity turned into visual experiments, interfaces and useful digital products.
  </text>

  <path d="M18 107 H1182" stroke="url(#aboutGradient)" stroke-width="2.5" opacity=".95"/>
</svg>
