<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="220"
     viewBox="0 0 1200 220"
     role="img"
     aria-label="Stellar Universe technology stack section artwork">

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#15132E"/>
      <stop offset="100%" stop-color="#20102D"/>
    </linearGradient>

    <linearGradient id="stellar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="planet">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#space)"/>

  <ellipse cx="1010" cy="105" rx="210" ry="115" fill="url(#planet)"/>

  <g fill="none" stroke="#06B6FF" opacity=".17">
    <ellipse cx="1000" cy="105" rx="170" ry="48" transform="rotate(-24 1000 105)"/>
    <ellipse cx="1000" cy="105" rx="210" ry="65" transform="rotate(-24 1000 105)"/>
    <ellipse cx="1000" cy="105" rx="245" ry="82" transform="rotate(-24 1000 105)"/>
  </g>

  <circle cx="1000" cy="105" r="39" fill="#7C3AED" opacity=".12" filter="url(#softGlow)"/>
  <circle cx="1000" cy="105" r="28" fill="#171A3B" stroke="#7C3AED" stroke-opacity=".7"/>

  <g fill="#EAF2FF">
    <circle cx="900" cy="42" r="2"/>
    <circle cx="1100" cy="50" r="1.5"/>
    <circle cx="1150" cy="150" r="2"/>
    <circle cx="825" cy="165" r="1.5"/>
    <circle cx="750" cy="65" r="1"/>
    <circle cx="1070" cy="190" r="1"/>
  </g>

  <g fill="#06B6FF">
    <path d="M850 75 L853 83 L861 86 L853 89 L850 97 L847 89 L839 86 L847 83Z"/>
    <path d="M1120 105 L1123 112 L1130 115 L1123 118 L1120 125 L1117 118 L1110 115 L1117 112Z"/>
  </g>

  <g transform="translate(55 43)">
    <text x="0" y="15"
      fill="#91A2C2"
      font-family="Arial,sans-serif"
      font-size="11"
      letter-spacing="4">EXPLORE MY DIGITAL UNIVERSE</text>

    <text x="0" y="85"
      fill="#F1F5FF"
      font-family="Arial,sans-serif"
      font-size="48"
      font-weight="700"
      letter-spacing="1">TECH STACK</text>

    <rect x="0" y="105" width="280" height="3" rx="2" fill="url(#stellar)"/>

    <text x="0" y="137"
      fill="#A6B4D0"
      font-family="Arial,sans-serif"
      font-size="14">Technology · Design · Development · AI</text>

    <text x="0" y="160"
      fill="#64748B"
      font-family="Arial,sans-serif"
      font-size="10"
      letter-spacing="2">TOOLS THAT TURN IDEAS INTO EXPERIENCES</text>
  </g>

  <rect x="0" y="217" width="1200" height="3" fill="url(#stellar)"/>
</svg>
