<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="SELECTED UNIVERSES">
  <defs>
    <linearGradient id="projects-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>

    <linearGradient id="projects-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF">
        <animate attributeName="stop-color" values="#06B6FF;#7C3AED;#EC4899;#06B6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6FF;#7C3AED;#EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="projects-stars" width="110" height="90" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
      <circle cx="72" cy="54" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="95" cy="12" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>

    <filter id="projects-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="110" rx="16" fill="url(#projects-bg)"/>
  <rect width="1200" height="110" rx="16" fill="url(#projects-stars)" opacity=".65"/>

  <path d="M0 107 H1200" stroke="url(#projects-grad)" stroke-width="2.5" filter="url(#projects-glow)"/>

  <text x="30" y="42" fill="#06B6FF" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">03 / STELLAR UNIVERSE</text>

  <text x="30" y="80" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="29" font-weight="700">SELECTED UNIVERSES</text>

  <text x="1170" y="72" text-anchor="end" fill="#A9B9D8" font-family="Arial, sans-serif" font-size="15">A growing constellation of ideas, products and experiments.</text>
</svg>
