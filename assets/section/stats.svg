<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="GitHub Signals Desktop">
<defs>
  <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1B"/><stop offset=".55" stop-color="#11152D"/><stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="sd-grad">
    <stop stop-color="#06B6FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <pattern id="sd-stars" width="100" height="80" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="18" r="1.2" fill="#DCEBFF" opacity=".7"/>
    <circle cx="72" cy="54" r="1" fill="#06B6FF" opacity=".7"/>
    <circle cx="90" cy="12" r="1" fill="#EC4899" opacity=".7"/>
  </pattern>
</defs>
<rect width="1000" height="140" rx="18" fill="url(#sd-bg)"/>
<rect width="1000" height="140" rx="18" fill="url(#sd-stars)"/>
<text x="30" y="42" fill="#06B6FF" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">06 / STELLAR UNIVERSE</text>
<text x="30" y="88" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="1">GITHUB SIGNALS</text>
<text x="970" y="76" text-anchor="end" fill="#9AA8C7" font-family="Arial,sans-serif" font-size="15">A live snapshot of code, consistency and contribution.</text>
<path d="M0 137 H1000" stroke="url(#sd-grad)" stroke-width="3"/>
</svg>
