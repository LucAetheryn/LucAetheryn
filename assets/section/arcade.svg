      <rect x="172" y="39" width="13" height="13" rx="3" fill="#1C4160"/>

      <rect x="39" y="58" width="13" height="13" rx="3" fill="#7C3AED"/>
      <rect x="58" y="58" width="13" height="13" rx="3" fill="#123B52"/>
      <rect x="77" y="58" width="13" height="13" rx="3" fill="#06B6FF"/>
      <rect x="96" y="58" width="13" height="13" rx="3" fill="#1C4160"/>
      <rect x="115" y="58" width="13" height="13" rx="3" fill="#7C3AED"/>
      <rect x="134" y="58" width="13" height="13" rx="3" fill="#EC4899"/>
      <rect x="153" y="58" width="13" height="13" rx="3" fill="#123B52"/>
      <rect x="172" y="58" width="13" height="13" rx="3" fill="#06B6FF"/>

      <rect x="39" y="77" width="13" height="13" rx="3" fill="#06B6FF"/>
      <rect x="58" y="77" width="13" height="13" rx="3" fill="#1C4160"/>
      <rect x="77" y="77" width="13" height="13" rx="3" fill="#7C3AED"/>
      <rect x="96" y="77" width="13" height="13" rx="3" fill="#123B52"/>
      <rect x="115" y="77" width="13" height="13" rx="3" fill="#06B6FF"/>
      <rect x="134" y="77" width="13" height="13" rx="3" fill="#1C4160"/>
      <rect x="153" y="77" width="13" height="13" rx="3" fill="#EC4899"/>
      <rect x="172" y="77" width="13" height="13" rx="3" fill="#7C3AED"/>

      <rect x="39" y="96" width="13" height="13" rx="3" fill="#123B52"/>
      <rect x="58" y="96" width="13" height="13" rx="3" fill="#7C3AED"/>
      <rect x="77" y="96" width="13" height="13" rx="3" fill="#06B6FF"/>
      <rect x="96" y="96" width="13" height="13" rx="3" fill="#EC4899"/>
      <rect x="115" y="96" width="13" height="13" rx="3" fill="#123B52"/>
