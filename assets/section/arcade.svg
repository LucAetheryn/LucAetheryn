<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Stellar Universe Contribution Arcade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop stop-color="#7C3AED" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="90" height="80" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1.2" fill="#DCEBFF" opacity=".7"/>
      <circle cx="65" cy="50" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="82" cy="12" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#stars)" opacity=".55"/>
  <ellipse cx="920" cy="140" rx="340" ry="210" fill="url(#nebula)"/>

  <g font-family="Arial, sans-serif">
    <text x="65" y="68" fill="#06B6FF" font-size="13" font-weight="700" letter-spacing="4">STELLAR UNIVERSE / LIVE ACTIVITY</text>
    <text x="65" y="122" fill="#F4F7FF" font-size="36" font-weight="700">CONTRIBUTION ARCADE</text>
    <text x="65" y="157" fill="#A9B7D4" font-size="16">Every commit is a move. Every project is another level.</text>
    <text x="65" y="222" fill="#7C8BAA" font-size="11" letter-spacing="2">BUILD · EXPERIMENT · REPEAT</text>
  </g>

  <!-- Arcade cabinet -->
  <g transform="translate(830 38)">
    <rect x="0" y="0" width="235" height="220" rx="18" fill="#0A1022" stroke="#7C3AED" stroke-opacity=".65" stroke-width="2"/>
    <rect x="13" y="13" width="209" height="130" rx="10" fill="#101A33" stroke="#06B6FF" stroke-opacity=".5"/>
    <rect x="23" y="23" width="189" height="110" rx="6" fill="#080D1B"/>

    <g opacity=".9">
      <rect x="39" y="39" width="13" height="13" rx="3" fill="#123B52"/>
      <rect x="58" y="39" width="13" height="13" rx="3" fill="#06B6FF"/>
      <rect x="77" y="39" width="13" height="13" rx="3" fill="#1C4160"/>
      <rect x="96" y="39" width="13" height="13" rx="3" fill="#7C3AED"/>
      <rect x="115" y="39" width="13" height="13" rx="3" fill="#EC4899"/>
