      <rect x="153" y="96" width="13" height="13" rx="3" fill="#06B6FF"/>
      <rect x="172" y="96" width="13" height="13" rx="3" fill="#123B52"/>
    </g>

    <path d="M42 171 H88" stroke="#06B6FF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="65" cy="171" r="13" fill="#111D37" stroke="#06B6FF" stroke-width="2"/>
    <circle cx="65" cy="171" r="4" fill="#06B6FF"/>
    <circle cx="157" cy="171" r="10" fill="#EC4899" opacity=".9"/>
    <circle cx="184" cy="171" r="10" fill="#7C3AED" opacity=".9"/>
    <text x="117" y="207" text-anchor="middle" fill="#A9B7D4" font-size="10" letter-spacing="2">PLAYER 01</text>
  </g>

  <g transform="translate(1090 75)" filter="url(#glow)">
    <path d="M0 -20 L6 -6 L20 0 L6 6 L0 20 L-6 6 L-20 0 L-6 -6 Z" fill="url(#energy)"/>
  </g>

  <path d="M22 297 H1178" stroke="url(#energy)" stroke-width="3"/>
</svg>
