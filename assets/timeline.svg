
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Creative journey from 2022 to 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF">
        <animate attributeName="stop-color" values="#06B6FF;#7C3AED;#EC4899;#06B6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6FF;#7C3AED;#EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="110" height="90" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
      <circle cx="72" cy="54" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="95" cy="12" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#stars)" opacity=".65"/>

  <path d="M105 120 H1095" stroke="#26304C" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 120 H1095" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- 2022 -->
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="110" y="67" fill="#06B6FF" font-size="25" font-weight="700">2022</text>
    <circle cx="110" cy="120" r="17" fill="#0F172A" stroke="#06B6FF" stroke-width="3" filter="url(#glow)"/>
    <path d="M110 109 L113 117 L121 120 L113 123 L110 131 L107 123 L99 120 L107 117 Z" fill="#DCEBFF"/>
    <text x="110" y="166" fill="#FFFFFF" font-size="16" font-weight="700">Creative Foundation</text>
    <text x="110" y="190" fill="#A9B9D8" font-size="13">Visual design &amp; illustration</text>
  </g>

  <!-- 2023 -->
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="355" y="67" fill="#06B6FF" font-size="25" font-weight="700">2023</text>
    <circle cx="355" cy="120" r="17" fill="#0F172A" stroke="#06B6FF" stroke-width="3" filter="url(#glow)"/>
    <path d="M347 113 H363 V127 H347 Z M350 109 H360 M350 131 H360" fill="none" stroke="#DCEBFF" stroke-width="2" stroke-linecap="round"/>
    <text x="355" y="166" fill="#FFFFFF" font-size="16" font-weight="700">Visual Exploration</text>
    <text x="355" y="190" fill="#A9B9D8" font-size="13">UI/UX &amp; digital interfaces</text>
  </g>

  <!-- 2024 -->
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="600" y="67" fill="#7C3AED" font-size="25" font-weight="700">2024</text>
    <circle cx="600" cy="120" r="17" fill="#0F172A" stroke="#7C3AED" stroke-width="3" filter="url(#glow)"/>
    <circle cx="600" cy="120" r="8" fill="none" stroke="#DCEBFF" stroke-width="2"/>
    <path d="M589 120 H611 M600 109 V131" stroke="#DCEBFF" stroke-width="1.5"/>
    <text x="600" y="166" fill="#FFFFFF" font-size="16" font-weight="700">Building Visual Identity</text>
    <text x="600" y="190" fill="#A9B9D8" font-size="13">Branding &amp; creative systems</text>
  </g>

  <!-- 2025 -->
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="845" y="67" fill="#7C3AED" font-size="25" font-weight="700">2025</text>
    <circle cx="845" cy="120" r="17" fill="#0F172A" stroke="#7C3AED" stroke-width="3" filter="url(#glow)"/>
    <path d="M837 113 H853 V127 H837 Z M841 109 H849 M841 131 H849 M840 118 H850 M840 122 H850" fill="none" stroke="#DCEBFF" stroke-width="1.7" stroke-linecap="round"/>
    <text x="845" y="166" fill="#FFFFFF" font-size="16" font-weight="700">Digital Product Development</text>
    <text x="845" y="190" fill="#A9B9D8" font-size="13">Independent products &amp; systems</text>
  </g>

  <!-- 2026 -->
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="1090" y="67" fill="#EC4899" font-size="25" font-weight="700">2026</text>
    <circle cx="1090" cy="120" r="17" fill="#0F172A" stroke="#EC4899" stroke-width="3" filter="url(#glow)"/>
    <path d="M1090 108 L1093 117 L1102 120 L1093 123 L1090 132 L1087 123 L1078 120 L1087 117 Z" fill="#DCEBFF"/>
    <text x="1090" y="166" fill="#FFFFFF" font-size="16" font-weight="700">Creative Engineering</text>
    <text x="1090" y="190" fill="#A9B9D8" font-size="13">AI-assisted creation &amp; development</text>
  </g>

  <text x="600" y="235" text-anchor="middle" fill="#8293B5" font-family="Arial, sans-serif" font-size="11" letter-spacing="3">AN ONGOING JOURNEY OF CREATIVITY &amp; DISCOVERY</text>
</svg>
