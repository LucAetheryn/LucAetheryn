<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200"
     height="230"
     viewBox="0 0 1200 230"
     role="img"
     aria-label="Animated technology stack">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#11102A"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <clipPath id="viewport">
      <rect width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="230" rx="18" fill="url(#background)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <g clip-path="url(#viewport)">
    <g opacity=".12" fill="none" stroke="#06B6FF">
      <circle cx="110" cy="60" r="45"/>
      <circle cx="110" cy="60" r="65"/>
      <circle cx="1050" cy="170" r="70"/>
      <circle cx="1050" cy="170" r="90"/>
    </g>

    <text x="32" y="28" fill="#A6B4D0"
          font-family="Arial,sans-serif" font-size="11"
          letter-spacing="3">DEVELOPMENT &amp; CREATIVE TOOLKIT</text>

    <g>
      <animateTransform attributeName="transform"
        type="translate" from="0 0" to="-1200 0"
        dur="32s" repeatCount="indefinite"/>

      <g>
        <image x="35" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/typescript/typescript-original.svg"/>
        <image x="135" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/javascript/javascript-original.svg"/>
        <image x="235" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg"/>
        <image x="335" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/java/java-original.svg"/>
        <image x="435" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg"/>
        <image x="535" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vitejs/vitejs-original.svg"/>
        <image x="635" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nextjs/nextjs-original.svg"/>
        <image x="735" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/tailwindcss/tailwindcss-original.svg"/>
        <image x="835" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nodejs/nodejs-original.svg"/>
        <image x="935" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg"/>
        <image x="1035" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/css3/css3-original.svg"/>
        <image x="1135" y="48" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/typescript/typescript-original.svg"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform"
        type="translate" from="-1200 0" to="0 0"
        dur="36s" repeatCount="indefinite"/>

      <g>
        <image x="35" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original.svg"/>
        <image x="135" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg"/>
        <image x="235" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg"/>
        <image x="335" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/firebase/firebase-plain.svg"/>
        <image x="435" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/supabase/supabase-original.svg"/>
        <image x="535" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/photoshop/photoshop-original.svg"/>
        <image x="635" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/illustrator/illustrator-plain.svg"/>
        <image x="735" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/aftereffects/aftereffects-original.svg"/>
        <image x="835" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/blender/blender-original.svg"/>
        <image x="935" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/canva/canva-original.svg"/>
        <image x="1035" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/docker/docker-original.svg"/>
        <image x="1135" y="125" width="42" height="42"
          xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original.svg"/>
      </g>
    </g>

    <text x="32" y="207" fill="#8290AA"
      font-family="Arial,sans-serif" font-size="10"
      letter-spacing="2">DESIGN · ENGINEERING · AI · DIGITAL PRODUCTS</text>
  </g>
</svg>
