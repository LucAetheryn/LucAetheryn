  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="176" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="176" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <path d="M0 87 H1200" stroke="#263B62" opacity=".55"/>

    <!-- ROW 1: LEFT -->
    <g>
