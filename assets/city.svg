<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Stellar Universe Cosmic City">
<defs>
  <linearGradient id="city-bg" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#080D1B"/><stop offset=".58" stop-color="#15152F"/><stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="city-light" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#06B6FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <linearGradient id="city-building" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#26375B"/><stop offset="1" stop-color="#10172C"/>
  </linearGradient>
  <pattern id="city-stars" width="100" height="80" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
    <circle cx="72" cy="54" r="1" fill="#06B6FF" opacity=".8"/>
    <circle cx="90" cy="12" r="1" fill="#EC4899" opacity=".7"/>
  </pattern>
</defs>

