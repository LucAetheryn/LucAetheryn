<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Stellar Universe Footer Artwork">
<defs>
  <linearGradient id="foot-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1B"/><stop offset=".55" stop-color="#11152D"/><stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="foot-grad" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#06B6FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <pattern id="foot-stars" width="100" height="80" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="18" r="1.3" fill="#DCEBFF" opacity=".7"/>
    <circle cx="72" cy="54" r="1" fill="#06B6FF" opacity=".8"/>
    <circle cx="90" cy="12" r="1" fill="#EC4899" opacity=".7"/>
  </pattern>
  <filter id="foot-glow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="300" rx="22" fill="url(#foot-bg)"/>
<rect width="1200" height="300" rx="22" fill="url(#foot-stars)"/>

<circle cx="600" cy="140" r="115" fill="#7C3AED" opacity=".06"/>
<circle cx="600" cy="140" r="85" fill="none" stroke="#7C3AED" stroke-opacity=".22"/>
<circle cx="600" cy="140" r="65" fill="none" stroke="#06B6FF" stroke-opacity=".2" stroke-dasharray="3 9"/>

<g transform="translate(600 115)" filter="url(#foot-glow)">
  <circle r="27" fill="#11152D" stroke="url(#foot-grad)" stroke-width="2"/>
  <path d="M-12 10 L0 -15 L12 10 L0 4 Z" fill="none" stroke="#06B6FF" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="0" cy="-2" r="3" fill="#EC4899"/>
  <path d="M-40 0 Q0 -45 40 0 Q0 45 -40 0Z" fill="none" stroke="#7C3AED" stroke-opacity=".65" stroke-width="1.5"/>
</g>

<g text-anchor="middle" font-family="Arial,sans-serif">
  <text x="600" y="192" fill="#F4F7FF" font-size="25" font-weight="700" letter-spacing="3">THANK YOU FOR EXPLORING</text>
  <text x="600" y="221" fill="#A9B9D8" font-size="13" letter-spacing="2">THE UNIVERSE IS BIGGER WHEN WE CREATE TOGETHER.</text>
  <text x="600" y="260" fill="#06B6FF" font-size="11" letter-spacing="3">STAY CURIOUS · KEEP BUILDING · REACH BEYOND</text>
</g>

<path d="M0 0 H1200" stroke="url(#foot-grad)" stroke-width="3"/>
<path d="M0 296 H1200" stroke="url(#foot-grad)" stroke-width="4"/>
<g fill="#DCEBFF">
  <circle cx="130" cy="115" r="2"/>
  <circle cx="1070" cy="105" r="2"/>
  <circle cx="210" cy="225" r="1.5"/>
  <circle cx="990" cy="225" r="1.5"/>
</g>
</svg>
