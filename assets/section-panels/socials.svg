<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Connect with Lucky Praditya on social media">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#17102B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#192440"/>
      <stop offset="1" stop-color="#11172B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="35" r="110" fill="#7C3AED" opacity=".12" filter="url(#glow)"/>
  <circle cx="110" cy="300" r="100" fill="#06B6FF" opacity=".09" filter="url(#glow)"/>

  <g fill="#DCE8FF">
    <circle cx="70" cy="52" r="1.5"/><circle cx="180" cy="95" r="1"/>
    <circle cx="310" cy="35" r="1.4"/><circle cx="480" cy="75" r="1"/>
    <circle cx="720" cy="38" r="1.4"/><circle cx="890" cy="92" r="1"/>
    <circle cx="1050" cy="110" r="1.5"/><circle cx="1140" cy="250" r="1"/>
    <circle cx="250" cy="285" r="1.2"/><circle cx="950" cy="290" r="1.2"/>
  </g>

  <text x="600" y="58" text-anchor="middle" fill="#06B6FF" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="5">STELLAR UNIVERSE · CONNECTIONS</text>
  <text x="600" y="112" text-anchor="middle" fill="#F1F5FF" font-family="Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="2">FIND ME ACROSS THE UNIVERSE.</text>
  <text x="600" y="145" text-anchor="middle" fill="#A6B4D0" font-family="Arial,sans-serif" font-size="15">Different platforms. One creative journey.</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(90 184)">
      <rect width="240" height="94" rx="15" fill="url(#card)" stroke="#344365"/>
      <rect x="18" y="20" width="54" height="54" rx="15" fill="#202E4A"/>
      <text x="45" y="55" text-anchor="middle" fill="#F8FAFF" font-size="22" font-weight="800">GH</text>
      <text x="88" y="42" fill="#F1F5FF" font-size="17" font-weight="700">GitHub</text>
      <text x="88" y="63" fill="#8FA4C9" font-size="12">Code &amp; projects</text>
      <circle cx="214" cy="47" r="3" fill="#06B6FF"/>
    </g>
    <g transform="translate(365 184)">
      <rect width="240" height="94" rx="15" fill="url(#card)" stroke="#344365"/>
      <rect x="18" y="20" width="54" height="54" rx="15" fill="#382344"/>
      <text x="45" y="55" text-anchor="middle" fill="#F8FAFF" font-size="22" font-weight="800">IG</text>
      <text x="88" y="42" fill="#F1F5FF" font-size="17" font-weight="700">Instagram</text>
      <text x="88" y="63" fill="#8FA4C9" font-size="12">Visual stories</text>
      <circle cx="214" cy="47" r="3" fill="#EC4899"/>
    </g>
    <g transform="translate(640 184)">
      <rect width="240" height="94" rx="15" fill="url(#card)" stroke="#344365"/>
      <rect x="18" y="20" width="54" height="54" rx="15" fill="#26304A"/>
      <text x="45" y="55" text-anchor="middle" fill="#F8FAFF" font-size="22" font-weight="800">TK</text>
      <text x="88" y="42" fill="#F1F5FF" font-size="17" font-weight="700">TikTok</text>
      <text x="88" y="63" fill="#8FA4C9" font-size="12">Creative moments</text>
      <circle cx="214" cy="47" r="3" fill="#06B6FF"/>
    </g>
    <g transform="translate(915 184)">
      <rect width="195" height="94" rx="15" fill="url(#card)" stroke="#344365"/>
      <rect x="16" y="20" width="54" height="54" rx="15" fill="#17334B"/>
      <text x="43" y="55" text-anchor="middle" fill="#F8FAFF" font-size="22" font-weight="800">in</text>
      <text x="82" y="42" fill="#F1F5FF" font-size="17" font-weight="700">LinkedIn</text>
      <text x="82" y="63" fill="#8FA4C9" font-size="12">Professional network</text>
    </g>
  </g>

  <rect x="90" y="312" width="1020" height="2" rx="1" fill="url(#accent)" opacity=".8"/>
</svg>
