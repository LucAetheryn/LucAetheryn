<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Stellar Universe Projects Panel">
  <defs>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="nebula">
      <stop stop-color="#7C3AED" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stars" width="100" height="85" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="17" r="1.2" fill="#DCEBFF" opacity=".7"/>
      <circle cx="68" cy="52" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="91" cy="12" r="1" fill="#EC4899" opacity=".7"/>
      <circle cx="38" cy="72" r=".7" fill="#FFFFFF" opacity=".5"/>
    </pattern>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#panel-bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#stars)" opacity=".65"/>

  <ellipse cx="1010" cy="130" rx="300" ry="210" fill="url(#nebula)"/>

  <g opacity=".18" fill="none" stroke="#9B8CFF">
    <ellipse cx="1000" cy="155" rx="190" ry="75" transform="rotate(-22 1000 155)"/>
    <ellipse cx="1000" cy="155" rx="245" ry="105" transform="rotate(-22 1000 155)"/>
  </g>

  <g transform="translate(1000 155)">
    <circle r="53" fill="#7C3AED" opacity=".12" filter="url(#soft-glow)"/>
    <circle r="39" fill="#11152D" stroke="#7C3AED" stroke-opacity=".55" stroke-width="1.5"/>
    <circle r="27" fill="#06B6FF" opacity=".12"/>
    <circle r="8" fill="#EC4899"/>
    <circle r="3" fill="#FFFFFF"/>
    <circle cx="85" cy="-42" r="5" fill="#06B6FF"/>
    <circle cx="-100" cy="40" r="3.5" fill="#EC4899"/>
    <circle cx="140" cy="48" r="2.5" fill="#FFFFFF"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="65" y="75" fill="#06B6FF" font-size="13" font-weight="700" letter-spacing="4">STELLAR UNIVERSE / PROJECT ARCHIVE</text>

    <text x="65" y="135" fill="#F4F7FF" font-size="38" font-weight="700" letter-spacing="1">A UNIVERSE OF IDEAS</text>

    <text x="65" y="175" fill="#B8C5E0" font-size="17">Independent creations. Different visions. One evolving universe.</text>

    <rect x="65" y="213" width="210" height="34" rx="17" fill="#FFFFFF" fill-opacity=".045" stroke="#7C3AED" stroke-opacity=".5"/>
    <circle cx="84" cy="230" r="4" fill="#06B6FF"/>
    <text x="98" y="235" fill="#DCEBFF" font-size="12" letter-spacing="1.5">EXPLORE THE COLLECTION</text>

    <text x="1135" y="278" text-anchor="end" fill="#8292B5" font-size="11" letter-spacing="2">CREATE · EXPLORE · EVOLVE</text>
  </g>

  <path d="M22 317 H1178" stroke="url(#accent)" stroke-width="3"/>
</svg>
