<svg xmlns="http://www.w3.org/2000/svg" width="640" height="130" viewBox="0 0 640 130" fill="none" role="img" aria-label="Find me across the universe" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#17102B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="640" height="130" rx="20" fill="url(#bg)"/>
  <circle cx="570" cy="10" r="80" fill="#7C3AED" opacity=".14" filter="url(#glow)"/>
  <circle cx="60" cy="125" r="70" fill="#06B6FF" opacity=".10" filter="url(#glow)"/>

  <g fill="#DCE8FF">
    <circle cx="40" cy="30" r="1.5"/><circle cx="130" cy="95" r="1"/>
    <circle cx="250" cy="18" r="1.3"/><circle cx="400" cy="100" r="1"/>
    <circle cx="520" cy="35" r="1.4"/><circle cx="610" cy="90" r="1"/>
  </g>

  <text x="320" y="34" text-anchor="middle" fill="#06B6FF" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="4">STELLAR UNIVERSE · CONNECTIONS</text>
  <text x="320" y="71" text-anchor="middle" fill="#F1F5FF" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="1">FIND ME ACROSS THE UNIVERSE.</text>
  <text x="320" y="97" text-anchor="middle" fill="#A6B4D0" font-family="Arial,sans-serif" font-size="14">Different platforms. One creative journey.</text>

  <rect x="40" y="118" width="560" height="2" rx="1" fill="url(#accent)" opacity=".8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
