<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="The Journey — Learning and Creative Evolution">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>

    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="nebula">
      <stop stop-color="#7C3AED" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="stars" width="100" height="85" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="17" r="1.2" fill="#DCEBFF" opacity=".7"/>
      <circle cx="68" cy="52" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="91" cy="12" r="1" fill="#EC4899" opacity=".7"/>
      <circle cx="38" cy="72" r=".7" fill="#FFFFFF" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#stars)" opacity=".65"/>

  <ellipse cx="940" cy="155" rx="310" ry="220" fill="url(#nebula)"/>

  <g font-family="Arial, sans-serif">
    <text x="65" y="62" fill="#06B6FF" font-size="13" font-weight="700" letter-spacing="4">
      PERSONAL EVOLUTION
    </text>

    <text x="65" y="112" fill="#F4F7FF" font-size="32" font-weight="700">
      EVERY STEP BUILDS SOMETHING
    </text>

    <text x="65" y="145" fill="#9AA8C7" font-size="15">
      A continuous journey of curiosity, experimentation and creation.
    </text>
  </g>

  <!-- Journey path -->
  <path d="M110 235 C230 235 250 190 365 205 S535 270 650 220 S825 165 930 205 S1050 235 1090 190"
        fill="none" stroke="#7C3AED" stroke-width="12" opacity=".13" filter="url(#glow)"/>

  <path d="M110 235 C230 235 250 190 365 205 S535 270 650 220 S825 165 930 205 S1050 235 1090 190"
        fill="none" stroke="url(#path)" stroke-width="3" stroke-linecap="round"/>

  <!-- Milestone 1 -->
  <g transform="translate(110 235)">
    <circle r="19" fill="#06B6FF" opacity=".13" filter="url(#glow)"/>
    <circle r="9" fill="#080D1B" stroke="#06B6FF" stroke-width="2.5"/>
    <circle r="3" fill="#06B6FF"/>
  </g>

  <!-- Milestone 2 -->
  <g transform="translate(365 205)">
    <circle r="19" fill="#7C3AED" opacity=".15" filter="url(#glow)"/>
    <circle r="9" fill="#080D1B" stroke="#7C3AED" stroke-width="2.5"/>
    <circle r="3" fill="#7C3AED"/>
  </g>

  <!-- Milestone 3 -->
  <g transform="translate(650 220)">
    <circle r="19" fill="#7C3AED" opacity=".15" filter="url(#glow)"/>
    <circle r="9" fill="#080D1B" stroke="#A78BFA" stroke-width="2.5"/>
    <circle r="3" fill="#A78BFA"/>
  </g>

  <!-- Milestone 4 -->
  <g transform="translate(930 205)">
    <circle r="19" fill="#EC4899" opacity=".15" filter="url(#glow)"/>
    <circle r="9" fill="#080D1B" stroke="#EC4899" stroke-width="2.5"/>
    <circle r="3" fill="#EC4899"/>
  </g>

  <!-- Milestone 5 -->
  <g transform="translate(1090 190)">
    <circle r="25" fill="#EC4899" opacity=".12" filter="url(#glow)"/>
    <circle r="12" fill="#080D1B" stroke="#EC4899" stroke-width="2.5"/>
    <circle r="4" fill="#EC4899"/>
  </g>

  <!-- Labels -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(110 278)">
      <text text-anchor="middle" fill="#06B6FF" font-size="12" font-weight="700" letter-spacing="1.5">01</text>
      <text text-anchor="middle" y="21" fill="#EAF2FF" font-size="13" font-weight="700">DISCOVER</text>
    </g>

    <g transform="translate(365 160)">
      <text text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="700" letter-spacing="1.5">02</text>
      <text text-anchor="middle" y="-17" fill="#EAF2FF" font-size="13" font-weight="700">LEARN</text>
    </g>

    <g transform="translate(650 270)">
      <text text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="700" letter-spacing="1.5">03</text>
      <text text-anchor="middle" y="21" fill="#EAF2FF" font-size="13" font-weight="700">EXPERIMENT</text>
    </g>

    <g transform="translate(930 160)">
      <text text-anchor="middle" fill="#EC4899" font-size="12" font-weight="700" letter-spacing="1.5">04</text>
      <text text-anchor="middle" y="-17" fill="#EAF2FF" font-size="13" font-weight="700">CREATE</text>
    </g>

    <g transform="translate(1090 235)">
      <text text-anchor="middle" fill="#EC4899" font-size="12" font-weight="700" letter-spacing="1.5">05</text>
      <text text-anchor="middle" y="21" fill="#EAF2FF" font-size="13" font-weight="700">EVOLVE</text>
    </g>
  </g>

  <text x="65" y="330" fill="#8292B5" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">
    NOT A FINISH LINE — JUST ANOTHER BEGINNING
  </text>

  <path d="M22 357 H1178" stroke="url(#path)" stroke-width="3"/>
</svg>
