<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Guestbook Desktop Section Panel">
<defs>
  <linearGradient id="gp-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1B"/>
    <stop offset=".6" stop-color="#12182F"/>
    <stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="gp-accent">
    <stop stop-color="#06B6FF"/>
    <stop offset=".5" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <pattern id="gp-stars" width="90" height="75" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="18" r="1.2" fill="#DCEBFF" opacity=".6"/>
    <circle cx="65" cy="52" r="1" fill="#06B6FF" opacity=".6"/>
  </pattern>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#gp-bg)"/>
<rect width="1200" height="340" rx="22" fill="url(#gp-stars)"/>
<circle cx="1040" cy="170" r="150" fill="#7C3AED" opacity=".07"/>
<circle cx="1040" cy="170" r="110" fill="none" stroke="#7C3AED" stroke-opacity=".25" stroke-dasharray="4 9"/>

<g transform="translate(72 65)">
  <text x="0" y="0" fill="#06B6FF" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">THE COMMUNITY SPACE</text>
  <text x="0" y="65" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="39" font-weight="700">LEAVE YOUR MARK.</text>
  <text x="0" y="108" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="39" font-weight="700">SHARE YOUR STORY.</text>
  <text x="2" y="151" fill="#A9B6D2" font-family="Arial,sans-serif" font-size="17">Every message becomes a small light in this universe.</text>
  <path d="M0 185 H470" stroke="url(#gp-accent)" stroke-width="3"/>
  <text x="0" y="220" fill="#8F9DBB" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">CONNECT · APPRECIATE · INSPIRE</text>
</g>

<g transform="translate(690 70)">
  <rect x="0" y="0" width="410" height="200" rx="18" fill="#17213A" stroke="#6679A7" stroke-opacity=".45"/>
  <path d="M0 18 Q0 0 18 0 H392 Q410 0 410 18" stroke="url(#gp-accent)" stroke-width="3" fill="none"/>
  <g transform="translate(30 32)">
    <circle cx="20" cy="20" r="19" fill="#06B6FF" fill-opacity=".16" stroke="#06B6FF" stroke-opacity=".7"/>
    <path d="M11 18 Q20 7 29 18 Q20 31 11 18Z" fill="#9DE5FF"/>
    <text x="56" y="17" fill="#EAF3FF" font-family="Arial,sans-serif" font-size="14" font-weight="700">A MESSAGE FOR YOU</text>
    <text x="56" y="37" fill="#8193B8" font-family="Arial,sans-serif" font-size="11">FROM ANOTHER CORNER OF THE UNIVERSE</text>
    <text x="0" y="91" fill="#D9E4F8" font-family="Arial,sans-serif" font-size="16">“The best journeys begin with</text>
    <text x="0" y="117" fill="#D9E4F8" font-family="Arial,sans-serif" font-size="16">curiosity. Keep exploring!”</text>
    <path d="M0 143 H350" stroke="#7D8BAA" stroke-opacity=".3"/>
    <text x="0" y="166" fill="#06B6FF" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">A FELLOW TRAVELER</text>
    <text x="350" y="166" text-anchor="end" fill="#EC4899" font-family="Arial,sans-serif" font-size="18">✦</text>
  </g>
</g>
<path d="M0 336 H1200" stroke="url(#gp-accent)" stroke-width="4"/>
</svg>
