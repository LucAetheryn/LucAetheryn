<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-label="Contribution Arcade Mobile Panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop stop-color="#7C3AED" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="85" height="75" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="17" r="1.2" fill="#DCEBFF" opacity=".7"/>
      <circle cx="68" cy="52" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="41" cy="8" r="1" fill="#EC4899" opacity=".7"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="440" rx="22" fill="url(#bg)"/>
  <rect width="600" height="440" rx="22" fill="url(#stars)" opacity=".6"/>
  <ellipse cx="430" cy="170" rx="250" ry="200" fill="url(#nebula)"/>

  <g font-family="Arial, sans-serif">
    <text x="32" y="48" fill="#06B6FF" font-size="12" font-weight="700" letter-spacing="3">STELLAR UNIVERSE / ARCADE</text>
    <text x="32" y="94" fill="#F4F7FF" font-size="29" font-weight="700">PLAY. BUILD. REPEAT.</text>
    <text x="32" y="123" fill="#A9B7D4" font-size="13">Every contribution moves the universe forward.</text>
  </g>

  <!-- Contribution grid -->
  <g transform="translate(32 155)">
    <text x="0" y="-12" fill="#7F91B5" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">CONTRIBUTION MATRIX</text>

    <g>
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="25" y="0" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="50" y="0" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="75" y="0" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="100" y="0" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="125" y="0" width="18" height="18" rx="4" fill="#EC4899"/>
      <rect x="150" y="0" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="175" y="0" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="200" y="0" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="225" y="0" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="250" y="0" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="275" y="0" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="300" y="0" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="325" y="0" width="18" height="18" rx="4" fill="#EC4899"/>
      <rect x="350" y="0" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="375" y="0" width="18" height="18" rx="4" fill="#123B52"/>

      <rect x="0" y="25" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="25" y="25" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="50" y="25" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="75" y="25" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="100" y="25" width="18" height="18" rx="4" fill="#EC4899"/>
      <rect x="125" y="25" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="150" y="25" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="175" y="25" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="200" y="25" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="225" y="25" width="18" height="18" rx="4" fill="#EC4899"/>
      <rect x="250" y="25" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="275" y="25" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="300" y="25" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="325" y="25" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="350" y="25" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="375" y="25" width="18" height="18" rx="4" fill="#1C4160"/>

      <rect x="0" y="50" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="25" y="50" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="50" y="50" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="75" y="50" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="100" y="50" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="125" y="50" width="18" height="18" rx="4" fill="#EC4899"/>
      <rect x="150" y="50" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="175" y="50" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="200" y="50" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="225" y="50" width="18" height="18" rx="4" fill="#1C4160"/>
      <rect x="250" y="50" width="18" height="18" rx="4" fill="#EC4899"/>
      <rect x="275" y="50" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="300" y="50" width="18" height="18" rx="4" fill="#7C3AED"/>
      <rect x="325" y="50" width="18" height="18" rx="4" fill="#06B6FF"/>
      <rect x="350" y="50" width="18" height="18" rx="4" fill="#123B52"/>
      <rect x="375" y="50" width="18" height="18" rx="4" fill="#EC4899"/>
    </g>
  </g>

  <!-- Arcade control panel -->
  <g transform="translate(32 275)">
    <rect width="536" height="105" rx="16" fill="#0A1022" stroke="#7C3AED" stroke-opacity=".6"/>
    <rect x="12" y="12" width="512" height="81" rx="10" fill="#101A33" stroke="#06B6FF" stroke-opacity=".3"/>

    <g transform="translate(70 52)">
      <rect x="-25" y="-8" width="50" height="16" rx="4" fill="#1A2A49"/>
      <rect x="-8" y="-25" width="16" height="50" rx="4" fill="#1A2A49"/>
      <circle r="9" fill="#06B6FF"/>
    </g>

    <circle cx="185" cy="52" r="14" fill="#EC4899" filter="url(#glow)"/>
    <circle cx="230" cy="52" r="14" fill="#7C3AED" filter="url(#glow)"/>

    <g font-family="Arial, sans-serif">
      <text x="285" y="46" fill="#EAF2FF" font-size="12" font-weight="700" letter-spacing="1.5">PLAYER 01</text>
      <text x="285" y="65" fill="#7F91B5" font-size="10" letter-spacing="1">KEEP CREATING</text>
    </g>
  </g>

  <text x="32" y="410" fill="#8292B5" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.5">
    SMALL CONTRIBUTIONS. BIGGER POSSIBILITIES.
  </text>

  <path d="M22 437 H578" stroke="url(#accent)" stroke-width="3"/>
</svg>
