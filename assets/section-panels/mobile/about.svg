<svg xmlns="http://www.w3.org/2000/svg" width="640" height="118" viewBox="0 0 640 118" role="img" aria-label="About the creator — The person behind the ideas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090D20"/>
      <stop offset=".55" stop-color="#11142B"/>
      <stop offset="1" stop-color="#17132F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset=".55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="stars" width="150" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="15" r="1.1" fill="#06B6FF"/>
      <circle cx="42" cy="68" r=".8" fill="#E8EEFF"/>
      <circle cx="86" cy="25" r="1.3" fill="#EC4899"/>
      <circle cx="119" cy="82" r=".9" fill="#DCE7FF"/>
      <circle cx="140" cy="45" r="1.1" fill="#06B6FF"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="118" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="116" rx="17" fill="url(#stars)" opacity=".9"/>
  <rect x="1" y="1" width="638" height="116" rx="17" fill="none" stroke="#35415F" stroke-width="1.2" opacity=".9"/>

  <rect x="20" y="17" width="8" height="84" rx="4" fill="url(#accent)" filter="url(#glow)"/>

  <text x="50" y="29" fill="#06B6FF" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.5">01 / STELLAR UNIVERSE</text>
  <text x="50" y="72" fill="#F2F4FF" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing=".2">ABOUT THE CREATOR</text>
  <text x="50" y="101" fill="#A8B4D4" font-family="Arial, sans-serif" font-size="16">The person behind the ideas</text>

  <g transform="translate(570 59)">
    <circle r="20" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity=".9"/>
    <circle r="12" fill="url(#planet)" opacity=".2"/>
    <circle r="10" fill="url(#planet)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4.5" fill="#06B6FF" opacity=".55"/>
    <circle cx="25" cy="-22" r="3" fill="#EC4899"/>
    <circle cx="-25" cy="23" r="1.8" fill="#06B6FF"/>
  </g>
</svg>
