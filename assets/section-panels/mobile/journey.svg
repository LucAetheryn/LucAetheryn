<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-label="The Journey — Mobile Creative Evolution">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>

    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="nebula">
      <stop stop-color="#7C3AED" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="stars" width="85" height="75" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="17" r="1.2" fill="#DCEBFF" opacity=".7"/>
      <circle cx="68" cy="52" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="41" cy="8" r="1" fill="#EC4899" opacity=".7"/>
      <circle cx="38" cy="65" r=".7" fill="#FFFFFF" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="600" height="420" rx="22" fill="url(#bg)"/>
  <rect width="600" height="420" rx="22" fill="url(#stars)" opacity=".65"/>
  <ellipse cx="430" cy="150" rx="230" ry="190" fill="url(#nebula)"/>

  <g font-family="Arial, sans-serif">
    <text x="32" y="48" fill="#06B6FF" font-size="12" font-weight="700" letter-spacing="3">
      PERSONAL EVOLUTION
    </text>
    <text x="32" y="91" fill="#F4F7FF" font-size="27" font-weight="700">
      EVERY STEP BUILDS
    </text>
    <text x="32" y="125" fill="#F4F7FF" font-size="27" font-weight="700">
      SOMETHING.
    </text>
    <text x="32" y="155" fill="#9AA8C7" font-size="13">
      A journey of curiosity, experimentation
    </text>
    <text x="32" y="175" fill="#9AA8C7" font-size="13">
      and continuous creation.
    </text>
  </g>

  <!-- Vertical journey route -->
  <path d="M105 220 C105 250 155 255 155 280 S105 320 105 345"
        fill="none" stroke="#7C3AED" stroke-width="12" opacity=".13" filter="url(#glow)"/>

  <path d="M105 220 C105 250 155 255 155 280 S105 320 105 345"
        fill="none" stroke="url(#path)" stroke-width="3" stroke-linecap="round"/>

  <!-- Milestone nodes -->
  <g>
    <circle cx="105" cy="220" r="13" fill="#080D1B" stroke="#06B6FF" stroke-width="2.5"/>
    <circle cx="105" cy="220" r="4" fill="#06B6FF"/>

    <circle cx="155" cy="280" r="13" fill="#080D1B" stroke="#7C3AED" stroke-width="2.5"/>
    <circle cx="155" cy="280" r="4" fill="#7C3AED"/>

    <circle cx="105" cy="345" r="13" fill="#080D1B" stroke="#A78BFA" stroke-width="2.5"/>
    <circle cx="105" cy="345" r="4" fill="#A78BFA"/>
  </g>

  <!-- Milestone content -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(140 220)">
      <text fill="#06B6FF" font-size="11" font-weight="700" letter-spacing="1.5">01 / DISCOVER</text>
      <text y="20" fill="#EAF2FF" font-size="13">Finding curiosity and direction.</text>
    </g>

    <g transform="translate(190 280)">
      <text fill="#A78BFA" font-size="11" font-weight="700" letter-spacing="1.5">02 / LEARN</text>
      <text y="20" fill="#EAF2FF" font-size="13">Building skills through practice.</text>
    </g>

    <g transform="translate(140 345)">
      <text fill="#EC4899" font-size="11" font-weight="700" letter-spacing="1.5">03 / EXPERIMENT</text>
      <text y="20" fill="#EAF2FF" font-size="13">Turning ideas into experiences.</text>
    </g>
  </g>

  <text x="32" y="402" fill="#8292B5" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.5">
    NOT A FINISH LINE — JUST ANOTHER BEGINNING
  </text>

  <path d="M22 417 H578" stroke="url(#path)" stroke-width="3"/>
</svg>
