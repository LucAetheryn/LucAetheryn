<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Stellar Universe Projects Mobile Panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#11152D"/>
      <stop offset="1" stop-color="#24113D"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="nebula">
      <stop stop-color="#7C3AED" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stars" width="85" height="75" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="17" r="1.2" fill="#DCEBFF" opacity=".7"/>
      <circle cx="68" cy="52" r=".9" fill="#06B6FF" opacity=".8"/>
      <circle cx="41" cy="8" r="1" fill="#EC4899" opacity=".7"/>
      <circle cx="38" cy="65" r=".7" fill="#FFFFFF" opacity=".5"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="600" height="340" rx="22" fill="url(#bg)"/>
  <rect width="600" height="340" rx="22" fill="url(#stars)" opacity=".65"/>

  <ellipse cx="430" cy="105" rx="220" ry="170" fill="url(#nebula)"/>

  <g transform="translate(430 105)">
    <g fill="none" stroke="#9B8CFF" opacity=".22">
      <ellipse rx="105" ry="40" transform="rotate(-25)"/>
      <ellipse rx="135" ry="55" transform="rotate(-25)"/>
    </g>
    <circle r="48" fill="#7C3AED" opacity=".15" filter="url(#glow)"/>
    <circle r="34" fill="#11152D" stroke="#7C3AED" stroke-opacity=".6" stroke-width="1.5"/>
    <circle r="23" fill="#06B6FF" opacity=".13"/>
    <circle r="7" fill="#EC4899"/>
    <circle r="3" fill="#FFFFFF"/>
    <circle cx="76" cy="-35" r="4.5" fill="#06B6FF"/>
    <circle cx="-75" cy="32" r="3.5" fill="#EC4899"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="32" y="45" fill="#06B6FF" font-size="11" font-weight="700" letter-spacing="3">
      STELLAR UNIVERSE
    </text>

    <text x="32" y="190" fill="#F4F7FF" font-size="30" font-weight="700" letter-spacing=".5">
      A UNIVERSE
    </text>
    <text x="32" y="228" fill="#F4F7FF" font-size="30" font-weight="700" letter-spacing=".5">
      OF IDEAS
    </text>

    <text x="32" y="260" fill="#B8C5E0" font-size="13">
      Independent creations. Different visions.
    </text>
    <text x="32" y="279" fill="#B8C5E0" font-size="13">
      One evolving universe.
    </text>

    <rect x="32" y="298" width="190" height="27" rx="13.5" fill="#FFFFFF" fill-opacity=".045" stroke="#7C3AED" stroke-opacity=".5"/>
    <circle cx="48" cy="311.5" r="3.5" fill="#06B6FF"/>
    <text x="60" y="316" fill="#DCEBFF" font-size="10" letter-spacing="1">
      EXPLORE COLLECTION
    </text>
  </g>

  <path d="M22 337 H578" stroke="url(#accent)" stroke-width="3"/>
</svg>
