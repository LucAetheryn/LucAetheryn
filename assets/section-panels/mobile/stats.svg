<defs>
  <linearGradient id="sm-pbg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1B"/><stop offset=".58" stop-color="#11152D"/><stop offset="1" stop-color="#24113D"/>
  </linearGradient>
  <linearGradient id="sm-pl">
    <stop stop-color="#06B6FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
