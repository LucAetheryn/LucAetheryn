name: Generate Contribution Arcade

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man and Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D SVGs
        shell: bash
        run: |
          mkdir -p dist

          if [ ! -d "profile-3d-contrib" ]; then
            echo "3D contribution output directory not found."
            exit 1
          fi

          find profile-3d-contrib -maxdepth 1 -type f -name "*.svg" \
            -exec cp {} dist/ \;

          if ! find profile-3d-contrib -maxdepth 1 -type f -name "*.svg" | grep -q .; then
            echo "No 3D SVG files were generated."
            exit 1
          fi

          echo "3D SVG files collected successfully."

      - name: Make Pac-Man and Breakout SVGs responsive
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          files = (
              glob.glob("dist/pacman-*.svg")
              + glob.glob("dist/breakout-*.svg")
          )

          if not files:
              print("No Pac-Man or Breakout SVG files found.")
              sys.exit(1)

          for path in files:
              with open(path, encoding="utf-8") as file:
                  source = file.read()

              match = re.search(r"<svg\b[^>]*>", source)

              if not match:
                  print(f"Invalid SVG root element: {path}")
                  sys.exit(1)

              tag = match.group(0)

              if not re.search(r'\bviewBox\s*=', tag):
                  width_match = re.search(
                      r'\bwidth=["\']([\d.]+)(?:px)?["\']',
                      tag
                  )
                  height_match = re.search(
                      r'\bheight=["\']([\d.]+)(?:px)?["\']',
                      tag
                  )

                  if not width_match or not height_match:
                      print(f"Cannot determine SVG dimensions: {path}")
                      sys.exit(1)

                  width = width_match.group(1)
                  height = height_match.group(1)

                  updated_tag = (
                      tag[:-1]
                      + f' viewBox="0 0 {width} {height}">'
                  )

                  source = source.replace(tag, updated_tag, 1)

              with open(path, "w", encoding="utf-8") as file:
                  file.write(source)

              print(f"Processed: {path}")
          PY

      - name: Verify generated SVG files
        shell: bash
        run: |
          echo "Generated SVG files:"
          find dist -maxdepth 1 -type f -name "*.svg" -print

          if ! find dist -maxdepth 1 -type f -name "*.svg" | grep -q .; then
            echo "No SVG files were generated."
            exit 1
          fi

          echo "SVG verification completed."

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
