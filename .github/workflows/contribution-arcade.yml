name: Generate Contribution Arcade

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man and Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D SVGs
        run: |
          mkdir -p dist
          cp profile-3d-contrib/*.svg dist/

      - name: Make Pac-Man and Breakout SVGs responsive
        run: |
          python3 - <<'PY'
          import glob, re
          for path in glob.glob("dist/pacman-*.svg") + glob.glob("dist/breakout-*.svg"):
              source = open(path, encoding="utf-8").read()
              match = re.search(r"<svg\\b[^>]*>", source)
              if not match:
                  continue
              tag = match.group(0)
              if "viewBox" not in tag:
                  width = re.search(r'\\bwidth="([\\d.]+)', tag).group(1)
                  height = re.search(r'\\bheight="([\\d.]+)', tag).group(1)
                  source = source.replace(tag, tag[:-1] + f' viewBox="0 0 {width} {height}">', 1)
                  open(path, "w", encoding="utf-8").write(source)
          PY

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
