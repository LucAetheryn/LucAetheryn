name: Sign the Stellar Guestbook
description: Leave a short message on Lucky's profile
title: "[guestbook] hello from "
labels: ["guestbook"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stopping by! Your message will appear on the profile after validation.
        Please keep it friendly and under 180 characters. Links and markdown formatting are removed.
  - type: textarea
    id: message
    attributes:
      label: Your message
      description: A short note from your corner of the universe.
      placeholder: Hello from my corner of the universe...
    validations:
      required: true
